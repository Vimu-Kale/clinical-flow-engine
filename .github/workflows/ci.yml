name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, gate, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The static safety gate. An unsafe pathway fails the build before any
      # test runs, so it can never reach a reviewer.
      - name: Validate pathways
        run: npm run validate:pathways

      - name: Test with coverage thresholds
        run: npm run coverage

      - name: Build studio
        run: npm run build
